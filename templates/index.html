<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .title {
            text-align: center;
            font-size: 32px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            padding: 14px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #5563d6;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f4f7ff;
            border-left: 5px solid #667eea;
            border-radius: 10px;
        }

        .result p {
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .result a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
            font-weight: bold;
        }

        .result a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }

            input[type="text"],
            button {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">URL Shortener</h1>
        <p class="subtitle">Paste your long URL and get a short, shareable link instantly.</p>

        <form method="POST">
            <input type="text" name="url" placeholder="Enter your long URL here" required>
            <button type="submit">Shorten URL</button>
        </form>

        {% if short_url %}
        <div class="result">
            <p>Your Short URL:</p>
            <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
        </div>
        {% endif %}

        <p class="footer-text">Simple, fast, and clean URL shortening</p>
    </div>

</body>
</html>
